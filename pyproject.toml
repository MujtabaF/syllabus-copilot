[project]
name = "syllabus-copilot"
version = "0.1.0"
description = "An AI agent that turns course syllabi into personalized study schedules."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "tenacity>=8.0",  # LiteLLM needs it for num_retries
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
syllabus-copilot = "syllabus_copilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syllabus_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
